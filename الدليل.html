<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مركز الاتصالات الإدارية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#D4A017; --gold-l:#F2C94C; --gold-d:#B8860B;
  --blue:#0B3D91; --blue-l:#1E5FBF; --blue-d:#062A66;
  --bg:#F7F5EF; --card:#ffffff; --text:#1a1a2e; --muted:#6b7280; --line:#e8e4d8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12121a; --card:#1c1c28; --text:#eef0f5; --muted:#9aa0ad; --line:#2c2c3c;
  }
}
:root[data-theme="dark"]{
  --bg:#12121a; --card:#1c1c28; --text:#eef0f5; --muted:#9aa0ad; --line:#2c2c3c;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Cairo',sans-serif; background:var(--bg); color:var(--text); min-height:100%;}
header{
  background:linear-gradient(135deg,var(--blue-d),var(--blue) 60%,var(--gold-d));
  padding:26px 18px calc(30px + env(safe-area-inset-top,0px));
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  box-shadow:0 4px 18px rgba(0,0,0,.25); text-align:center;
  position:relative;
}
.logo-top{
  position:absolute; top:calc(16px + env(safe-area-inset-top,0px)); right:16px;
  width:150px; height:auto; flex:none; border-radius:6px;
}
@media (max-width:480px){
  .logo-top{width:100px; top:calc(10px + env(safe-area-inset-top,0px)); right:10px}
  header{padding-top:70px}
}
.title-block h1{font-size:24px; font-weight:800; color:#fff; letter-spacing:.5px}
.signature{
  position:absolute; bottom:8px; left:16px;
  font-family:'Aref Ruqaa', serif; font-size:12px; color:rgba(255,255,255,.75);
}
main{max-width:960px; margin:0 auto; padding:22px 16px 40px}
.search-card{
  background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px;
  box-shadow:0 6px 24px rgba(11,61,145,.08);
}
.search-row{display:flex; gap:10px; position:relative}
#q{
  flex:1; padding:13px 16px; border-radius:12px; border:2px solid var(--line);
  font-family:inherit; font-size:15px; background:var(--bg); color:var(--text); outline:none;
}
#q:focus{border-color:var(--gold)}
.btn{
  background:linear-gradient(135deg,var(--blue),var(--blue-l)); color:#fff; border:none;
  padding:0 20px; border-radius:12px; font-family:inherit; font-weight:700; font-size:14px; cursor:pointer;
}
.btn:active{transform:scale(.97)}
.suggest{
  position:absolute; top:calc(100% + 6px); right:0; left:0; background:var(--card);
  border:1px solid var(--line); border-radius:12px; overflow:hidden; z-index:20;
  box-shadow:0 10px 30px rgba(0,0,0,.15); max-height:260px; overflow-y:auto; display:none;
}
.suggest div{padding:10px 14px; font-size:13.5px; cursor:pointer; border-bottom:1px solid var(--line)}
.suggest div:last-child{border-bottom:none}
.suggest div:hover, .suggest div.active{background:var(--gold-l); color:#1a1a2e}
.suggest small{color:var(--muted); display:block; font-size:11px; margin-top:2px}
.hint{font-size:12px; color:var(--muted); margin-top:8px}
.stats{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap}
.stat{
  flex:1; min-width:110px; background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:12px 14px; text-align:center;
}
.stat b{font-size:20px; color:var(--blue-l); display:block}
:root[data-theme="dark"] .stat b, body:not([data-theme]) .stat b{}
.stat span{font-size:11.5px; color:var(--muted)}
#result{margin-top:20px}
.empty{
  text-align:center; color:var(--muted); padding:40px 10px; font-size:14px;
}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:20px; overflow:hidden;
  box-shadow:0 10px 30px rgba(11,61,145,.12); animation:pop .25s ease;
}
@keyframes pop{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)}}
.card-head{
  background:linear-gradient(120deg,var(--blue-d),var(--blue));
  color:#fff; padding:20px; display:flex; align-items:center; gap:14px;
}
.avatar{
  width:58px; height:58px; border-radius:50%; background:linear-gradient(135deg,var(--gold),var(--gold-d));
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:20px; color:#1a1a2e; flex:none;
}
.card-head h2{font-size:18px; font-weight:800}
.card-head p{font-size:13px; opacity:.9; margin-top:3px}
.badge{
  display:inline-block; margin-top:6px; background:rgba(255,255,255,.18); padding:3px 10px;
  border-radius:20px; font-size:11px;
}
.grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1px;
  background:var(--line);
}
.field{background:var(--card); padding:14px 16px}
.field label{font-size:11px; color:var(--muted); display:block; margin-bottom:4px}
.field div{font-size:14.5px; font-weight:700; word-break:break-word}
.field.wide{grid-column:1 / -1}
.field .dir{direction:ltr; text-align:right; unicode-bidi:plain-text}
footer{text-align:center; color:var(--muted); font-size:11px; padding:18px; opacity:.7}
</style>
</head>

<script>
// EMP: [no,name,dept,ext,fileNo,civilId,title,rank,grade,hireDate,rankDate,qual,mobile,email]
const depts = [...new Set(EMP.map(e=>e[2]))];
document.getElementById('totalEmp').textContent = EMP.length;
document.getElementById('totalDept').textContent = depts.length;

const q = document.getElementById('q');
const suggestBox = document.getElementById('suggest');
const resultBox = document.getElementById('result');
let activeIdx = -1;

function norm(s){ return (s+'').replace(/[إأآا]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').trim(); }

function matches(term){
  const t = norm(term).toLowerCase();
  if(!t) return [];
  return EMP.filter(e => norm(e[1]).toLowerCase().includes(t) || (''+e[4]).includes(term) || (''+e[0]).includes(term)).slice(0,8);
}

function renderSuggest(list){
  activeIdx = -1;
  if(!list.length){ suggestBox.style.display='none'; suggestBox.innerHTML=''; return; }
  suggestBox.innerHTML = list.map((e,i)=>`<div data-i="${i}" onclick="pick(${e[4]})">${e[1]}<small>الرقم الوظيفي: ${e[4]} · ${e[2]}</small></div>`).join('');
  suggestBox.style.display='block';
  suggestBox._list = list;
}

q.addEventListener('input', ()=> renderSuggest(matches(q.value)));
q.addEventListener('keydown', (ev)=>{
  const items = suggestBox.querySelectorAll('div');
  if(ev.key==='ArrowDown'){ ev.preventDefault(); activeIdx=Math.min(activeIdx+1, items.length-1); updateActive(items); }
  else if(ev.key==='ArrowUp'){ ev.preventDefault(); activeIdx=Math.max(activeIdx-1,0); updateActive(items); }
  else if(ev.key==='Enter'){
    if(activeIdx>=0 && suggestBox._list && suggestBox._list[activeIdx]) pick(suggestBox._list[activeIdx][4]);
    else doSearch();
  } else if(ev.key==='Escape'){ suggestBox.style.display='none'; }
});
function updateActive(items){ items.forEach((el,i)=> el.classList.toggle('active', i===activeIdx)); }

document.addEventListener('click',(e)=>{ if(!e.target.closest('.search-row')) suggestBox.style.display='none'; });

function pick(fileNo){
  const e = EMP.find(x=>x[4]===fileNo);
  q.value = e ? e[1] : '';
  suggestBox.style.display='none';
  if(e) show(e);
}

function doSearch(){
  const list = matches(q.value);
  suggestBox.style.display='none';
  if(list.length===1){ show(list[0]); }
  else if(list.length>1){ renderSuggest(list); suggestBox.style.display='block'; }
  else { resultBox.innerHTML = `<div class="empty">لا توجد نتائج مطابقة لـ "${q.value}"</div>`; }
}

function fld(label, value, wide){
  return `<div class="field${wide?' wide':''}"><label>${label}</label><div>${value || '-'}</div></div>`;
}
function fldDir(label, value){
  return `<div class="field"><label>${label}</label><div class="dir">${value || '-'}</div></div>`;
}

function show(e){
  const initials = (e[1]||'').trim().split(/\s+/)[0]?.[0] || 'م';
  resultBox.innerHTML = `
  <div class="card">
    <div class="card-head">
      <div class="avatar">${initials}</div>
      <div>
        <h2>${e[1]}</h2>
        <p>${e[6]}</p>
      </div>
    </div>
    <div class="grid">
      ${fld('المنصب / المسمى الوظيفي', e[6])}
      ${fld('رقم التحويلة', e[3])}
    </div>
  </div>`;
}
</script>
